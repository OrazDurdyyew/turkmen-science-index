services:
  grobid:
    image: lfoppiano/grobid:0.8.1
    ports:
      - "8070:8070"
    restart: ${RESTART_POLICY:-no}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8070'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  parser:
    build: ./services/parser
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GROBID_URL=http://grobid:8070
      # Local Supabase runs on the host; in production point this at the project URL
      - SUPABASE_URL=${PARSER_SUPABASE_URL:-http://host.docker.internal:54321}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY_JWT}
      # Comma-separated list of frontend origins allowed to call the parser
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      grobid:
        condition: service_healthy
    restart: ${RESTART_POLICY:-no}

  # Production frontend (static build + nginx): docker compose --profile prod up -d --build
  frontend:
    profiles: ["prod"]
    build:
      context: ./frontend
      args:
        SUPABASE_URL: ${PUBLIC_SUPABASE_URL:-http://localhost:54321}
        SUPABASE_KEY: ${SUPABASE_KEY}
        PARSER_URL: ${PUBLIC_PARSER_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: ${RESTART_POLICY:-no}
